<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat App</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Chat App</div>
    <div class="me">👤 {{ username }} <a href="/logout">Logout</a></div>
    <input id="userSearch" class="search" placeholder="Search users...">
    <div id="users"></div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <div><strong id="chatName">Select a user</strong><small id="status"></small></div>
    </header>

    <section id="messages" class="messages">
      <div class="empty">Choose a user to start chatting.</div>
    </section>

    <section class="composer">
      <input id="fileInput" type="file" hidden>
      <button id="attachBtn" title="Attach file">📎</button>
      <button id="recordBtn" title="Voice note">🎙️</button>
      <input id="messageInput" placeholder="Type a message..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </section>
    <div id="recording" class="recording hidden">🔴 Recording... click 🎙️ again to stop</div>
  </main>
</div>
<script>
window.CURRENT_USER_ID = {{ user_id }};
window.CURRENT_USERNAME = {{ username|tojson }};
</script>
<script src="/static/js/chat.js"></script>
</body>
</html>
